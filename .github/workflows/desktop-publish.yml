name: Desktop Publish

# Publishing a GitHub Release tagged desktop-v<major>.<minor>.<patch> (for
# example desktop-v0.2.0) builds the Mac DMGs at that tag and attaches them to
# the release. Installed apps check these releases and offer the DMG for their
# Mac once it is attached. When the build signed an in-app update (secret
# TAURI_SIGNING_PRIVATE_KEY), the release also gets Sure-macOS-<arch>.app.tar.gz
# and latest.json, and installed apps update themselves from those instead.
# The tag is the app version, so each release must be higher than the one
# before.
#
# To rebuild the DMGs of an existing release, run this workflow by hand with
# its tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach DMGs to (desktop-vX.Y.Z)"
        type: string
        required: true

concurrency:
  group: desktop-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Read version
    # Other releases (the server's v* releases) are not desktop releases.
    if: startsWith(github.event.release.tag_name || inputs.tag, 'desktop-v')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#desktop-v}"
          echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::tag '$TAG' must look like desktop-v1.2.3"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    uses: ./.github/workflows/desktop-local-build.yml
    with:
      ref: ${{ needs.version.outputs.tag }}
      version: ${{ needs.version.outputs.version }}
      macos: true
      windows: false
    secrets: inherit

  attach:
    name: Attach DMGs to release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: sure-desktop-*macos-*
          path: artifacts

      # Stable names, so the app (and any website link) can find the DMG for
      # its architecture: releases/latest/download/Sure-macOS-arm64.dmg
      - name: Name the DMGs
        run: |
          set -euo pipefail
          mkdir release
          # Whichever architectures desktop-local-build.yml built; Apple
          # Silicon is required.
          [ -d artifacts/sure-desktop-macos-arm64 ] || { echo "::error::no arm64 DMG was built"; exit 1; }
          for dir in artifacts/sure-desktop-macos-*/; do
            arch="$(basename "$dir")"; arch="${arch#sure-desktop-macos-}"
            dmg=("$dir"*.dmg)
            [ "${#dmg[@]}" -eq 1 ] && [ -f "${dmg[0]}" ] || { echo "::error::expected one DMG for $arch"; exit 1; }
            cp "${dmg[0]}" "release/Sure-macOS-$arch.dmg"
          done
          ls -l release

      # Tauri's static update manifest. Written only when every architecture
      # with a DMG has a signed update, so no Mac is pointed at an update it can't get.
      - name: Write the update manifest
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          platforms='{}'
          for dmg in release/Sure-macOS-*.dmg; do
            arch="$(basename "$dmg" .dmg)"; arch="${arch#Sure-macOS-}"
            case "$arch" in
              arm64) target=darwin-aarch64 ;;
              x86_64) target=darwin-x86_64 ;;
              *) echo "::error::unknown architecture $arch"; exit 1 ;;
            esac
            dir="artifacts/sure-desktop-update-macos-$arch"
            tarball=("$dir"/*.app.tar.gz)
            if [ ! -f "${tarball[0]}" ] || [ ! -f "${tarball[0]}.sig" ]; then
              echo "::warning::no signed in-app update for $arch; installed apps will offer the DMG instead"
              exit 0
            fi
            cp "${tarball[0]}" "release/Sure-macOS-$arch.app.tar.gz"
            platforms="$(jq --arg t "$target" --arg url "$base/Sure-macOS-$arch.app.tar.gz" \
              --arg sig "$(cat "${tarball[0]}.sig")" '. + {($t): {url: $url, signature: $sig}}' <<<"$platforms")"
          done
          jq -n --arg v "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson p "$platforms" \
            '{version: $v, pub_date: $date, platforms: $p}' > release/latest.json
          cat release/latest.json

      # The manifest goes up last: it must never point at files not uploaded yet.
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          gh release upload "$TAG" release/*.dmg release/*.app.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
          if [ -f release/latest.json ]; then
            gh release upload "$TAG" release/latest.json --clobber --repo "$GITHUB_REPOSITORY"
          fi
