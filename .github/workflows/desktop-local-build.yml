name: Desktop (local-only) Build

# Builds Sure Desktop with everything bundled — Ruby, the Rails app, PostgreSQL
# and Valkey — so it runs with no server: a .dmg per Mac architecture and a
# Windows installer (.exe). All user data stays in the app's local data folder.
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build bundled runtime (Ruby, app, PostgreSQL, Valkey)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SURE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: desktop/scripts/build-runtime-macos.sh

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build DMG
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri build --config src-tauri/tauri.local.conf.json --target ${{ matrix.rust_target }}

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sure-desktop-macos-${{ matrix.arch }}
          path: desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      # The runner image ships MSYS2 at C:\msys64, which is also where
      # RubyInstaller looks for its toolchain when compiling native gems.
      - name: Install MSYS2 toolchains
        shell: pwsh
        run: |
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --needed --noconfirm gcc make pkgconf mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-libyaml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Valkey
        shell: C:\msys64\usr\bin\bash.exe --login -eo pipefail {0}
        env:
          MSYSTEM: MSYS
          CHERE_INVOKING: "1"
        run: desktop/scripts/build-valkey-msys2.sh

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Build bundled runtime (Ruby, app, PostgreSQL)
        shell: pwsh
        env:
          SURE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: desktop/scripts/build-runtime-windows.ps1

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build installer
        working-directory: desktop
        run: npx tauri build --config src-tauri/tauri.local.conf.json

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sure-desktop-windows-x64
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
